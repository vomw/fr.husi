name: Android production APKs

on:
  workflow_dispatch:

# The signing keystore is restored from a repository secret. No GitHub token is
# required to build or upload workflow artifacts.
permissions:
  contents: read

jobs:
  build:
    name: signed FossRelease APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - uses: ./.github/actions/setup-ndk
      - uses: ./.github/actions/setup-jbr
      - uses: ./.github/actions/gradle-cache
        with:
          read-only: 'true'
          build-cache-name: release-android
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: ./.github/actions/go-android-cache
        with:
          read-only: 'true'
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: >-
            assets-v2-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}-${{ hashFiles('buildScript/lib/assets.sh', 'libcore/cmd/internal/ruleset_generate/**', 'libcore/go.mod', 'libcore/go.sum') }}
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          chmod 600 release.keystore
      - name: Write signing properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          test -n "$LOCAL_PROPERTIES"
          printf '%s' "$LOCAL_PROPERTIES" > local.properties
      - name: Build Android libcore
        run: make libcore_android
      - name: Download Go modules
        run: cd libcore && go mod download
      - name: Generate about libraries metadata
        run: make aboutlibraries_go aboutlibraries_android
      - name: Build signed production APK splits
        run: make apk
      - name: Stage and verify ABI APKs
        id: apks
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(find androidApp/build/outputs/apk -name output-metadata.json -print -quit)
          test -n "$metadata"
          mkdir -p release-artifacts
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -n "$apksigner"

          app_id=$(jq -er '.applicationId' "$metadata")
          version_name=$(jq -er '.elements[0].versionName' "$metadata")
          version_code=$(jq -er '.elements[0].versionCode | tostring' "$metadata")
          printf 'artifact_prefix=%s-%s-%s\n' "$app_id" "$version_name" "$version_code" >> "$GITHUB_OUTPUT"

          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            output_file=$(jq -er --arg abi "$abi" '
              .elements[]
              | select(any(.filters[]?; .filterType == "ABI" and .value == $abi))
              | .outputFile
            ' "$metadata")
            source_apk="$(dirname "$metadata")/$output_file"
            target_apk="release-artifacts/${app_id}-${version_name}-${version_code}-${abi}.apk"
            test -f "$source_apk"
            cp "$source_apk" "$target_apk"
            "$apksigner" verify --verbose --print-certs "$target_apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apks.outputs.artifact_prefix }}-arm64-v8a
          path: release-artifacts/*-arm64-v8a.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apks.outputs.artifact_prefix }}-armeabi-v7a
          path: release-artifacts/*-armeabi-v7a.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apks.outputs.artifact_prefix }}-x86_64
          path: release-artifacts/*-x86_64.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apks.outputs.artifact_prefix }}-x86
          path: release-artifacts/*-x86.apk
          if-no-files-found: error
