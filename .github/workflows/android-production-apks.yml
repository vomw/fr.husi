name: Android production APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: FOSS release (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
      ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go from libcore/go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      - name: Set up Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          add-to-path: true
          ndk-version: r29
          local-cache: false

      - name: Verify the hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?The hosted runner did not set ANDROID_HOME.}"
          platform_dir=
          for candidate in android-37 android-37.0 android-37.1 android-37.2; do
            if [[ -f "$ANDROID_HOME/platforms/$candidate/android.jar" ]]; then
              platform_dir=$candidate
              break
            fi
          done
          [[ -n "$platform_dir" ]] || {
            echo "The selected hosted runner lacks Android API 37." >&2
            find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort >&2 || true
            exit 1
          }
          echo "Using hosted Android platform: $platform_dir"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner" || {
            echo "The selected hosted runner lacks Android Build Tools 37.0.0." >&2
            find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort >&2 || true
            exit 1
          }
          test -f "${{ steps.setup-ndk.outputs.ndk-path }}/source.properties"
          {
            echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}"
            echo "NDK=${{ steps.setup-ndk.outputs.ndk-path }}"
          } >> "$GITHUB_ENV"

      - name: Restore the release keystore
        shell: bash
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required repository secret $variable is not set." >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build the production APK for ${{ matrix.abi }}
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          BUILD_PLUGIN: none
        run: |
          set -euo pipefail
          chmod +x gradlew run
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          case "$ABI" in
            arm64-v8a) task=assembleFossReleaseArm64 ;;
            armeabi-v7a) task=assembleFossReleaseArm ;;
            x86_64) task=assembleFossReleaseX64 ;;
            x86) task=assembleFossReleaseX86 ;;
            *) echo "Unsupported ABI: $ABI" >&2; exit 1 ;;
          esac

          # These aliases make the existing ABI-aware Gradle configuration select
          # exactly one split. They exist only for this disposable CI checkout.
          cat > "$RUNNER_TEMP/abi-tasks.gradle" <<'EOF'
          gradle.beforeProject { project ->
              if (project.path == ':androidApp') {
                  project.tasks.register('assembleFossReleaseArm64') { dependsOn 'assembleFossRelease' }
                  project.tasks.register('assembleFossReleaseArm') { dependsOn 'assembleFossRelease' }
                  project.tasks.register('assembleFossReleaseX64') { dependsOn 'assembleFossRelease' }
                  project.tasks.register('assembleFossReleaseX86') { dependsOn 'assembleFossRelease' }
              }
          }
          EOF

          make assets
          make libcore_android
          ./gradlew --no-daemon --stacktrace --init-script "$RUNNER_TEMP/abi-tasks.gradle" ":androidApp:$task"

      - name: Sign, verify, and stage ${{ matrix.abi }}
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          app_id=$(sed -n 's/^PACKAGE_NAME=//p' husi.properties)
          version_name=$(sed -n 's/^VERSION_NAME=//p' husi.properties)
          version_code=$(sed -n 's/^VERSION_CODE=//p' husi.properties)
          for value in "$app_id" "$version_name" "$version_code"; do
            [[ -n "$value" && "$value" != *[/$'\r\n']* ]] || {
              echo 'Invalid package or version metadata.' >&2
              exit 1
            }
          done

          mapfile -t apks < <(find androidApp/build/outputs/apk/foss/release -maxdepth 1 -type f -name "*${ABI}*.apk" -print)
          [[ ${#apks[@]} -eq 1 ]] || {
            printf 'Expected one %s APK, found %s:\n%s\n' "$ABI" "${#apks[@]}" "${apks[*]:-}" >&2
            exit 1
          }

          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          "$build_tools/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$ALIAS_NAME" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:ALIAS_PASS \
            --out signed.apk "${apks[0]}"
          "$build_tools/apksigner" verify --verbose --print-certs signed.apk

          badging=$("$build_tools/aapt" dump badging signed.apk)
          [[ "$badging" == *"package: name='$app_id' versionCode='$version_code' versionName='$version_name'"* ]] || {
            echo 'APK package/version metadata does not match husi.properties.' >&2
            exit 1
          }
          [[ "$badging" == *"native-code:"*"'$ABI'"* ]] || {
            echo "APK does not contain the expected $ABI native-code entry." >&2
            exit 1
          }

          mkdir -p dist
          artifact_name="${app_id}-${version_name}-${version_code}-${ABI}.apk"
          mv signed.apk "dist/$artifact_name"
          printf 'artifact=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.abi }} APK
        uses: actions/upload-artifact@v4
        with:
          name: android-foss-release-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
