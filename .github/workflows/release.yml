name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      no-publish:
        description: Build artifacts without publishing a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - uses: ./.github/actions/setup-ndk
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ./.github/actions/gradle-cache
        with:
          read-only: 'true'
          build-cache-name: release-android
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: ./.github/actions/go-android-cache
        with:
          read-only: 'true'
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: >-
            assets-v2-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}-${{ hashFiles('buildScript/lib/assets.sh', 'libcore/cmd/internal/ruleset_generate/**', 'libcore/go.mod', 'libcore/go.sum') }}
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          chmod 600 release.keystore
      - name: Write signing properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          test -n "$LOCAL_PROPERTIES"
          printf '%s' "$LOCAL_PROPERTIES" > local.properties
      - name: Build Android libcore
        run: make libcore_android
      - name: Download Go modules
        run: cd libcore && go mod download
      - name: Generate about libraries metadata
        run: make aboutlibraries
      - name: Build Android app
        run: make apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: mapping-android
          path: androidApp/build/outputs/mapping/fossRelease/mapping.txt
          if-no-files-found: error
          compression-level: 9

  publish:
    needs: android
    if: ${{ !inputs.no-publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android
          path: release-artifacts
      - name: Download R8 mapping
        uses: actions/download-artifact@v8
        with:
          name: mapping-android
          path: mapping
      - name: Bundle R8 mapping
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: cd mapping && zip -9 -r -q "$GITHUB_WORKSPACE/release-artifacts/mapping-$RELEASE_TAG.zip" .
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --title "$RELEASE_TAG" --generate-notes --prerelease
          fi
